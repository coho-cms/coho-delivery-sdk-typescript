name: Check

# Version branches only, such as v2026.1.0: pull requests into one, and commits to one.
on:
  pull_request:
    branches: ['v*']
  push:
    branches: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
